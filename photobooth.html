<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Derrin's Birthday Photo Booth</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            background-color: #8b3fd9;
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 8px;
            text-align: center;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            max-width: 340px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            margin: 2px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }
        .subtitle {
            font-size: 0.65rem;
            color: #f3e8ff;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .booth-strip {
            width: 280px;
            height: 640px;
            background-color: #ffffff;
            background-image: url('photobooth_card.png');
            background-repeat: repeat;
            background-size: 180px;
            border-radius: 16px;
            padding: 15px 12px;
            position: relative;
            margin-bottom: 6px;
            border: 4px solid #f3e8ff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .viewport-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1e293b;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, img.shot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .camera-message {
            color: #64748b;
            font-size: 0.65rem;
            text-align: center;
            padding: 5px;
            font-weight: 600;
        }
        .draggable-sticker {
            position: absolute;
            font-size: 2.2rem;
            cursor: grab;
            user-select: none;
            z-index: 100;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            display: inline-block;
            padding: 0;
            touch-action: none;
        }
        .draggable-sticker:active {
            cursor: grabbing;
        }
        .emoji-tray {
            display: flex;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 4px;
            width: 100%;
            max-width: 280px;
        }
        .tray-emoji {
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .tray-emoji:active { transform: scale(1.2); }
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 4px;
            width: 100%;
        }
        .btn {
            background: #ffffff;
            color: #6b21a8;
            border: none;
            padding: 6px 12px;
            border-radius: 14px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .btn:active { transform: scale(0.95); }
        .btn-action { background: #fde047; color: #581c87; }
        .btn-download { background: #4ade80; color: #065f46; display: none; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.7rem;
            display: inline-block;
        }
        .status-text {
            font-size: 0.7rem;
            color: #f3e8ff;
            font-weight: 600;
            height: 14px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Derrin's Birthday Photo Booth</h1>
        <div class="subtitle">4 slots open • Drag and drop stickers!</div>
        <div class="status-text" id="statusText">Ready to snap photo 1 of 4</div>

        <div class="booth-strip" id="boothStrip">
            <div class="viewport-box" id="viewport0">
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div class="viewport-box" id="viewport1"><span class="camera-message">Slot 2 (Waiting)</span></div>
            <div class="viewport-box" id="viewport2"><span class="camera-message">Slot 3 (Waiting)</span></div>
            <div class="viewport-box" id="viewport3"><span class="camera-message">Slot 4 (Waiting)</span></div>
        </div>

        <div class="emoji-tray">
            <span class="tray-emoji" onclick="spawnSticker('🦄')" title="Unicorn">🦄</span>
            <span class="tray-emoji" onclick="spawnSticker('🎀')" title="Bow">🎀</span>
            <span class="tray-emoji" onclick="spawnSticker('🎉')" title="Confetti">🎉</span>
            <span class="tray-emoji" onclick="spawnSticker('👑')" title="Crown">👑</span>
            <span class="tray-emoji" onclick="spawnSticker('💖')" title="Hearts">💖</span>
        </div>

        <div class="toolbar">
            <button class="btn btn-action" id="snapBtn" onclick="nextShot()">📸 Snap (1/4)</button>
            <button class="btn btn-download" id="downloadBtn" onclick="downloadBoothCard()">⬇️ Download Card</button>
            <button class="btn" id="retakeBtn" style="display:none;" onclick="resetBooth()">🔄 Retake</button>
        </div>

        <div>
            <a href="arcade.html" class="back-btn">← Back to Arcade</a>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const ctx = hiddenCanvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const snapBtn = document.getElementById('snapBtn');
        const boothStrip = document.getElementById('boothStrip');

        let currentShotIndex = 0;
        let cameraStream = null;

        async function initCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = cameraStream;
                await video.play();
            } catch (err) {
                console.warn("Camera access denied or unavailable:", err);
                document.getElementById('viewport0').innerHTML = '<span class="camera-message">Camera unavailable. Click Snap to simulate capture!</span>';
            }
        }
        initCamera();

        function spawnSticker(emoji) {
            const sticker = document.createElement('div');
            sticker.classList.add('draggable-sticker');
            sticker.innerText = emoji;
            
            sticker.style.left = '100px';
            sticker.style.top = '280px';

            makeDraggable(sticker);
            boothStrip.appendChild(sticker);
        }

        function makeDraggable(elm) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            elm.addEventListener('pointerdown', (e) => {
                isDragging = true;
                elm.setPointerCapture(e.pointerId);
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(elm.style.left) || elm.offsetLeft;
                initialTop = parseFloat(elm.style.top) || elm.offsetTop;
                e.preventDefault();
            });

            elm.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                elm.style.left = (initialLeft + dx) + 'px';
                elm.style.top = (initialTop + dy) + 'px';
            });

            elm.addEventListener('pointerup', (e) => {
                isDragging = false;
                try { elm.releasePointerCapture(e.pointerId); } catch(err) {}
            });
        }

        function nextShot() {
            const activeViewport = document.getElementById('viewport' + currentShotIndex);
            
            if (cameraStream && video.readyState >= 2) {
                const vWidth = video.videoWidth;
                const vHeight = video.videoHeight;
                const targetAspect = 16 / 9;
                
                let sWidth = vWidth;
                let sHeight = vWidth / targetAspect;
                let sX = 0;
                let sY = (vHeight - sHeight) / 2;

                if (sHeight > vHeight) {
                    sHeight = vHeight;
                    sWidth = vHeight * targetAspect;
                    sX = (vWidth - sWidth) / 2;
                    sY = 0;
                }

                hiddenCanvas.width = 640;
                hiddenCanvas.height = 360;
                ctx.drawImage(video, sX, sY, sWidth, sHeight, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                
                const img = document.createElement('img');
                img.src = hiddenCanvas.toDataURL('image/png');
                img.classList.add('shot-img');
                activeViewport.innerHTML = '';
                activeViewport.appendChild(img);
            } else {
                activeViewport.innerHTML = `<div style="width:100%;height:100%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:0.8rem;">Shot ${currentShotIndex + 1} 💖</div>`;
            }

            currentShotIndex++;

            if (currentShotIndex < 4) {
                const nextBox = document.getElementById('viewport' + currentShotIndex);
                if (cameraStream) {
                    nextBox.innerHTML = '';
                    nextBox.appendChild(video);
                } else {
                    nextBox.innerHTML = `<span class="camera-message">Slot ${currentShotIndex + 1} (Waiting)</span>`;
                }
                statusText.innerText = `Ready to snap photo ${currentShotIndex + 1} of 4`;
                snapBtn.innerText = `📸 Snap (${currentShotIndex + 1}/4)`;
            } else {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                statusText.innerText = "All 4 photos captured! Ready to download card.";
                snapBtn.style.display = 'none';
                document.getElementById('downloadBtn').style.display = 'inline-block';
                document.getElementById('retakeBtn').style.display = 'inline-block';
            }
        }

        function resetBooth() {
            currentShotIndex = 0;
            initCamera();
            for (let i = 0; i < 4; i++) {
                document.getElementById('viewport' + i).innerHTML = `<span class="camera-message">Slot ${i + 1} (Waiting)</span>`;
            }
            const vp0 = document.getElementById('viewport0');
            vp0.innerHTML = '';
            vp0.appendChild(video);

            boothStrip.querySelectorAll('.draggable-sticker').forEach(st => st.remove());

            statusText.innerText = "Ready to snap photo 1 of 4";
            snapBtn.innerText = "📸 Snap (1/4)";
            snapBtn.style.display = 'inline-block';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('retakeBtn').style.display = 'none';
        }

        function downloadBoothCard() {
            const cardCanvas = document.createElement('canvas');
            const cCtx = cardCanvas.getContext('2d');
            
            cardCanvas.width = 600;
            cardCanvas.height = 1250;

            const bgImg = new Image();
            bgImg.crossOrigin = "anonymous";
            bgImg.src = 'photobooth_card.png';
            
            bgImg.onload = () => {
                const patCanvas = document.createElement('canvas');
                const pCtx = patCanvas.getContext('2d');
                patCanvas.width = 360;
                patCanvas.height = 360;
                pCtx.drawImage(bgImg, 0, 0, 360, 360);

                const pattern = cCtx.createPattern(patCanvas, 'repeat');
                cCtx.fillStyle = pattern;
                cCtx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);
                buildCard();
            };

            bgImg.onerror = () => {
                cCtx.fillStyle = '#fce7f3';
                cCtx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);
                buildCard();
            };

            function buildCard() {
                let loadedImgs = 0;
                const viewports = [0, 1, 2, 3].map(i => document.getElementById('viewport' + i));
                
                viewports.forEach((vp, idx) => {
                    const imgEl = vp.querySelector('img');
                    const imgY = 45 + (idx * 295);
                    
                    if (imgEl) {
                        const shotImage = new Image();
                        shotImage.src = imgEl.src;
                        shotImage.onload = () => {
                            cCtx.drawImage(shotImage, 50, imgY, 500, 281);
                            checkComplete();
                        };
                    } else {
                        cCtx.fillStyle = '#3b82f6';
                        cCtx.fillRect(50, imgY, 500, 281);
                        cCtx.fillStyle = '#ffffff';
                        cCtx.font = '22px Fredoka, sans-serif';
                        cCtx.textAlign = 'center';
                        cCtx.fillText(`Slot ${idx + 1} 💖`, 300, imgY + 140);
                        checkComplete();
                    }
                });

                function checkComplete() {
                    loadedImgs++;
                    if (loadedImgs === 4) finalizeDownload();
                }
            }

            function finalizeDownload() {
                const scaleX = cardCanvas.width / boothStrip.clientWidth;
                const scaleY = cardCanvas.height / boothStrip.clientHeight;

                boothStrip.querySelectorAll('.draggable-sticker').forEach(st => {
                    const pixelLeft = parseFloat(st.style.left) || 0;
                    const pixelTop = parseFloat(st.style.top) || 0;

                    const x = pixelLeft * scaleX;
                    const y = pixelTop * scaleY;
                    
                    const baseFontSize = 65; 
                    cCtx.save();
                    cCtx.font = `${baseFontSize}px sans-serif`;
                    cCtx.textBaseline = 'top';
                    cCtx.textAlign = 'left';
                    cCtx.fillText(st.innerText, x, y);
                    cCtx.restore();
                });

                const link = document.createElement('a');
                link.download = 'birthday-photobooth-card.png';
                link.href = cardCanvas.toDataURL('image/png');
                link.click();
            }
        }
    </script>
</body>
</html>
