<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satisfying Slime</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* Disables default browser pan/zoom gestures completely for buttery-smooth interaction */
        }
        body {
            background-color: #8b3fd9;
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
            text-align: center;
            color: #ffffff;
            height: 100vh;
            height: 100dvh; /* Mobile viewport fix for address bar shifts */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: fixed; /* Prevents mobile rubber-band scrolling */
            width: 100%;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }
        h1 {
            font-size: 1.3rem;
            margin: 4px 0 2px 0;
            color: #f2f4f5;
        }
        .subtitle {
            font-size: 0.7rem;
            color: #f9f9f9;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .canvas-box {
            flex: 1;
            background: #1e293b;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 3px solid #334155;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.4);
            min-height: 0; /* Flexbox overflow fix */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .color-btn:active { transform: scale(0.85); }
        .back-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Slime</h1>
        <div class="subtitle">Drag or tap to squish and stretch!</div>

        <div class="canvas-box">
            <canvas id="slimeCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="color-btn" style="background: #ec4899;" onclick="setSlimeColor('#ec4899')"></div>
            <div class="color-btn" style="background: #8b5cf6;" onclick="setSlimeColor('#8b5cf6')"></div>
            <div class="color-btn" style="background: #3b82f6;" onclick="setSlimeColor('#3b82f6')"></div>
            <div class="color-btn" style="background: #10b981;" onclick="setSlimeColor('#10b981')"></div>
            <div class="color-btn" style="background: #facc15;" onclick="setSlimeColor('#facc15')"></div>
        </div>

        <div>
            <a href="arcade.html" class="back-btn">← Back to Arcade</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('slimeCanvas');
        const ctx = canvas.getContext('2d');
        
        // High-DPI (Retina) display optimization for crisp graphics on mobile screens
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.parentElement.clientWidth * dpr;
            canvas.height = canvas.parentElement.clientHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        let slimeColor = '#ec4899';
        function setSlimeColor(color) {
            slimeColor = color;
        }

        // Reduced blob count slightly for locked 60fps performance on lower-end mobile CPUs
        let blobs = [];
        const logicalWidth = () => canvas.width / (window.devicePixelRatio || 1);
        const logicalHeight = () => canvas.height / (window.devicePixelRatio || 1);

        function initBlobs() {
            blobs = [];
            for(let i=0; i<12; i++) {
                blobs.push({
                    x: Math.random() * logicalWidth(),
                    y: Math.random() * logicalHeight(),
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    radius: Math.random() * 35 + 25
                });
            }
        }
        initBlobs();

        let targetX = logicalWidth() / 2;
        let targetY = logicalHeight() / 2;
        let isInteracting = false;

        // Unified Pointer Events handle Mouse, Touch, and Multi-touch naturally
        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;
            isInteracting = true;
        }

        canvas.addEventListener('pointerdown', (e) => {
            canvas.setPointerCapture(e.pointerId);
            handlePointerMove(e);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (isInteracting) {
                handlePointerMove(e);
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            isInteracting = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        canvas.addEventListener('pointercancel', () => {
            isInteracting = false;
        });

        function animate() {
            const w = logicalWidth();
            const h = logicalHeight();

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = slimeColor;
            
            // Note: Heavy shadowBlur can tank mobile GPU performance, kept optimized
            ctx.shadowBlur = 12;
            ctx.shadowColor = slimeColor;

            blobs.forEach(b => {
                if (isInteracting) {
                    let dx = targetX - b.x;
                    let dy = targetY - b.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180) {
                        b.x += dx * 0.1;
                        b.y += dy * 0.1;
                    }
                }
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 20 || b.x > w - 20) b.vx *= -1;
                if (b.y < 20 || b.y > h - 20) b.vy *= -1;

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw central gooey core pulled towards touch
            ctx.beginPath();
            ctx.arc(targetX, targetY, isInteracting ? 50 : 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
